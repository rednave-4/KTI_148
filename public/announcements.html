<!DOCTYPE html>

  <meta charset="UTF-8">

<body>

    </ul>
  </nav>

  <main class="container">
    <h1 style="margin-bottom: 1.5rem; color: var(--primary);">Semua Pengumuman Kegiatan Sekolah</h1>
    <div id="announcements-list" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 1.5rem;">

  </footer>

  <script src="/js/announcements.js"></script>

  <script>
    // 1. Cek preferensi tema yang tersimpan saat halaman dimuat
    const currentTheme = localStorage.getItem('theme') || 'light';
    if (currentTheme === 'dark') {
      document.documentElement.classList.add('dark');
    }

    // 2. Fungsi saat tombol diklik
    const themeToggleBtn = document.getElementById('theme-toggle');
    if (themeToggleBtn) {
      themeToggleBtn.addEventListener('click', () => {
        // Toggle class 'dark' pada tag root (<html>)
        document.documentElement.classList.toggle('dark');
        
        // Simpan status pilihan ke localStorage
        let theme = 'light';
        if (document.documentElement.classList.contains('dark')) {
          theme = 'dark';
        }
        localStorage.setItem('theme', theme);
      });
    }
  </script>
</body>
</html>
