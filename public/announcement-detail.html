<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detail Pengumuman - SMAN 10 Samarinda</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="navbar">
    <a href="/" class="nav-brand">SMAN 10 Samarinda</a>
    <ul class="nav-links">
      <li><a href="/">Beranda</a></li>
      <li><a href="/announcements.html">Pengumuman</a></li>
      <li><a href="/map.html">Denah Sekolah</a></li>
      <li><a href="/admin/login.html">Login OSIS</a></li>
    </ul>
  </nav>

  <main class="container" style="max-width: 800px;">
    <div id="detail-container" class="card">
      <p>Memuat detail pengumuman...</p>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 SMAN 10 Samarinda - KTI: Sistem Informasi Pengumuman & Wayfinding SVG.</p>
  </footer>

  <script src="/js/announcement-detail.js"></script>

    <!-- Tombol Toggle Tema -->
  <button id="theme-toggle" class="floating-theme-btn" 
    style="position: fixed; bottom: 20px; right: 20px; z-index: 9999; 
           padding: 12px 16px; border-radius: 50px; 
           background-color: #1e293b; color: #f8fafc; 
           border: none; cursor: pointer; 
           box-shadow: 0 4px 6px rgba(0,0,0,0.2);">
    🌙 / ☀️
  </button>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const savedTheme = localStorage.getItem('theme') || 'light';
      if (savedTheme === 'dark') {
        document.documentElement.classList.add('dark');
      }

      const toggleBtn = document.getElementById('theme-toggle');
      if (toggleBtn) {
        toggleBtn.addEventListener('click', () => {
          document.documentElement.classList.toggle('dark');
          const activeTheme = document.documentElement.classList.contains('dark') ? 'dark' : 'light';
          localStorage.setItem('theme', activeTheme);
        });
      }
    });
  </script>

  <!-- Bagian untuk menampilkan QR Code menuju tautan pengumuman ini -->
  <div class="qr-container" style="margin-top: 2rem; text-align: center; padding: 1rem; border: 1px dashed var(--border); border-radius: 8px;">
    <p style="font-size: 0.9rem; color: var(--text-light); margin-bottom: 0.5rem;">Pindai QR Code ini untuk membuka pengumuman di perangkat seluler:</p>
    <img id="qr-code-img" src="" alt="QR Code Pengumuman" style="width: 120px; height: 120px;">
  </div>

  <script>
    // Skrip otomatis untuk menghasilkan QR Code berdasarkan URL halaman saat ini
    const currentUrl = window.location.href;
    const qrImg = document.getElementById('qr-code-img');
    qrImg.src = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(currentUrl)}`;
  </script>
</body>
</html>
