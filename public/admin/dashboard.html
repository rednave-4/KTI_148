<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Admin OSIS - SMAN 10 Samarinda</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    th, td { border: 1px solid var(--border); padding: 0.75rem; text-align: left; font-size: 0.9rem; }
    th { background: #f1f5f9; color: var(--primary); }
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
    .modal-content { background: white; padding: 2rem; border-radius: var(--radius); width: 100%; max-width: 600px; max-height: 90vh; overflow-y: auto; }
    .form-group { margin-bottom: 1rem; }
    .form-group label { display: block; margin-bottom: 0.3rem; font-weight: 500; font-size: 0.9rem; }
    .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 0.5rem; border: 1px solid var(--border); border-radius: var(--radius); }
  </style>
</head>
<body>
  <nav class="navbar">
    <a href="/admin/dashboard.html" class="nav-brand">Dashboard OSIS - SMAN 10 Samarinda</a>
    <button id="logout-btn" class="btn btn-secondary" style="font-size: 0.85rem; padding: 0.4rem 0.8rem;">Logout</button>
  </nav>

  <main class="container">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
      <h2>Manajemen Pengumuman Kegiatan</h2>
      <button id="open-modal-btn" class="btn">+ Tambah Pengumuman</button>
    </div>

    <div class="card" style="overflow-x: auto;">
      <table id="admin-table">
        <thead>
          <tr>
            <th>Judul</th>
            <th>Tanggal</th>
            <th>Lokasi</th>
            <th>Status</th>
            <th>Aksi</th>
          </tr>
        </thead>
        <tbody id="admin-tbody">
          <tr><td colspan="5" style="text-align: center;">Memuat data...</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <!-- Modal Form -->
  <div id="announcement-modal" class="modal">
    <div class="modal-content">
      <h3 id="modal-title" style="margin-bottom: 1rem; color: var(--primary);">Tambah Pengumuman Baru</h3>
      <form id="announcement-form" enctype="multipart/form-data">
        <input type="hidden" id="announcement-id">
        <div class="form-group">
          <label>Judul Kegiatan</label>
          <input type="text" id="title" required>
        </div>
        <div class="form-group">
          <label>Deskripsi</label>
          <textarea id="description" rows="4" required></textarea>
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
          <div class="form-group">
            <label>Tanggal Pelaksanaan</label>
            <input type="date" id="event_date" required>
          </div>
          <div class="form-group">
            <label>Status Publikasi</label>
            <select id="status">
              <option value="draft">Draft</option>
              <option value="published">Published</option>
              <option value="archived">Archived</option>
            </select>
          </div>
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
          <div class="form-group">
            <label>Waktu Mulai</label>
            <input type="time" id="start_time" required>
          </div>
          <div class="form-group">
            <label>Waktu Selesai (Opsional)</label>
            <input type="time" id="end_time">
          </div>
        </div>
        <div class="form-group">
          <label>Lokasi Kegiatan</label>
          <select id="location_id">
            <option value="">-- Pilih Lokasi Sekolah --</option>
          </select>
        </div>
        <div class="form-group">
          <label>Poster Kegiatan (Opsional - Maks 5MB)</label>
          <input type="file" id="poster" accept="image/jpeg,image/png,image/webp">
        </div>
        <div style="display: flex; justify-content: flex-end; gap: 1rem; margin-top: 1.5rem;">
          <button type="button" id="close-modal-btn" class="btn btn-secondary">Batal</button>
          <button type="submit" class="btn">Simpan</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/admin.js"></script>

    <!-- Tombol Toggle Tema -->
  <button id="theme-toggle" class="floating-theme-btn" 
    style="position: fixed; bottom: 20px; right: 20px; z-index: 9999; 
           padding: 12px 16px; border-radius: 50px; 
           background-color: #1e293b; color: #f8fafc; 
           border: none; cursor: pointer; 
           box-shadow: 0 4px 6px rgba(0,0,0,0.2); 
           transition: transform 0.2s;">
    🌙 / ☀️
  </button>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // Terapkan tema yang tersimpan
      const savedTheme = localStorage.getItem('theme') || 'light';
      if (savedTheme === 'dark') {
        document.documentElement.classList.add('dark');
      }

      // Event toggle
      const toggleBtn = document.getElementById('theme-toggle');
      if (toggleBtn) {
        toggleBtn.addEventListener('click', () => {
          document.documentElement.classList.toggle('dark');
          const activeTheme = document.documentElement.classList.contains('dark') ? 'dark' : 'light';
          localStorage.setItem('theme', activeTheme);
        });
      }
    });
  </script>
</body>
</html>
