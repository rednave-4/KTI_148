<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Admin - SMARIDASA</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #f1f5f9;
      color: #1e293b;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    html.dark body {
      background-color: #0f172a;
      color: #f8fafc;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      padding: 2.5rem;
      border-radius: 12px;
      background-color: #ffffff;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      transition: background-color 0.3s ease, box-shadow 0.3s ease;
    }

    html.dark .login-card {
      background-color: #1e293b;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
    }

    .login-title {
      text-align: center;
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 2rem;
      color: #1e3a8a;
    }

    html.dark .login-title {
      color: #60a5fa;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 600;
      font-size: 0.9rem;
    }

    .form-group input {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 1rem;
      background-color: #f8fafc;
      color: #0f172a;
      box-sizing: border-box;
      transition: border-color 0.2s, background-color 0.3s, color 0.3s;
    }

    html.dark .form-group input {
      background-color: #0f172a;
      border-color: #334155;
      color: #f8fafc;
    }

    .form-group input:focus {
      outline: none;
      border-color: #2563eb;
    }

    .btn-login {
      width: 100%;
      padding: 0.75rem;
      background-color: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 1rem;
      transition: background-color 0.2s;
    }

    .btn-login:hover {
      background-color: #1d4ed8;
    }

    .btn-login:disabled {
      background-color: #94a3b8;
      cursor: not-allowed;
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.9rem;
      color: #64748b;
      text-decoration: none;
    }

    html.dark .back-link {
      color: #94a3b8;
    }

    .back-link:hover {
      color: #2563eb;
    }

    .error-message {
      background-color: #fee2e2;
      color: #991b1b;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      margin-bottom: 1.25rem;
      font-size: 0.9rem;
      display: none;
    }

    html.dark .error-message {
      background-color: #7f1d1d;
      color: #fecaca;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <h2 class="login-title">Login Admin</h2>

    <div id="error-message" class="error-message"></div>

    <form id="login-form">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="Masukkan username" required autocomplete="username">
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="••••••••••••" required autocomplete="current-password">
      </div>

      <button type="submit" class="btn-login" id="login-btn">Masuk Dashboard</button>
    </form>

    <a href="/" class="back-link">&larr; Kembali ke Beranda</a>
  </div>

  <!-- Tombol Toggle Tema -->
  <button id="theme-toggle" class="floating-theme-btn" 
    style="position: fixed; bottom: 20px; right: 20px; z-index: 9999; 
          width: 48px; height: 48px; border-radius: 50%; 
          background-color: #1e293b; color: #f8fafc; 
          border: none; cursor: pointer; 
          box-shadow: 0 4px 6px rgba(0,0,0,0.2);
          font-size: 1.25rem; display: flex; align-items: center; justify-content: center;
          transition: transform 0.2s, background-color 0.2s;">
    🌙
  </button>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // ======================
      // Theme Toggle (1 ikon)
      // ======================
      const toggleBtn = document.getElementById('theme-toggle');

      function updateThemeIcon() {
        if (!toggleBtn) return;
        const isDark = document.documentElement.classList.contains('dark');
        toggleBtn.textContent = isDark ? '☀️' : '🌙';
      }

      // Terapkan tema yang tersimpan
      const savedTheme = localStorage.getItem('theme') || 'light';
      if (savedTheme === 'dark') {
        document.documentElement.classList.add('dark');
      }
      updateThemeIcon();

      if (toggleBtn) {
        toggleBtn.addEventListener('click', () => {
          document.documentElement.classList.toggle('dark');
          const activeTheme = document.documentElement.classList.contains('dark') ? 'dark' : 'light';
          localStorage.setItem('theme', activeTheme);
          updateThemeIcon();
        });
      }

      // ======================
      // Show / Hide Password
      // ======================
      const togglePasswordBtn = document.getElementById('toggle-password');
      const passwordInput = document.getElementById('password');

      if (togglePasswordBtn && passwordInput) {
        togglePasswordBtn.addEventListener('click', () => {
          const isPassword = passwordInput.type === 'password';
          passwordInput.type = isPassword ? 'text' : 'password';
          togglePasswordBtn.textContent = isPassword ? '🙈' : '👁️';
        });
      }

      // ======================
      // Login Logic
      // ======================
      const form = document.getElementById('login-form');
      const errorBox = document.getElementById('error-message');
      const loginBtn = document.getElementById('login-btn');

      if (form) {
        form.addEventListener('submit', async (e) => {
          e.preventDefault();

          const username = document.getElementById('username').value.trim();
          const password = document.getElementById('password').value;

          errorBox.style.display = 'none';
          errorBox.textContent = '';
          loginBtn.disabled = true;
          loginBtn.textContent = 'Memproses...';

          try {
            const res = await fetch('/api/admin/auth/login', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json'
              },
              body: JSON.stringify({ username, password })
            });

            const result = await res.json();

            if (result.success) {
              window.location.href = '/admin/dashboard.html';
            } else {
              errorBox.textContent = result.message || 'Username atau password salah.';
              errorBox.style.display = 'block';
              loginBtn.disabled = false;
              loginBtn.textContent = 'Masuk Dashboard';
            }
          } catch (err) {
            console.error(err);
            errorBox.textContent = 'Gagal terhubung ke server. Coba lagi.';
            errorBox.style.display = 'block';
            loginBtn.disabled = false;
            loginBtn.textContent = 'Masuk Dashboard';
          }
        });
      }
    });
  </script>
</body>
</html>
