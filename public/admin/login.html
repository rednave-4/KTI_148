<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Admin - SMARIDASA</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    /* Styling Satu Halaman Penuh yang Responsif terhadap Dark Mode */
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #f1f5f9; /* Background Light Mode (Satu Halaman) */
      color: #1e293b;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    /* Ketika Dark Mode Aktif pada tag <html> */
    html.dark body {
      background-color: #0f172a; /* Background Dark Mode (Satu Halaman Penuh) */
      color: #f8fafc;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      padding: 2.5rem;
      border-radius: 12px;
      background-color: #ffffff; /* Kotak Login Light Mode */
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      transition: background-color 0.3s ease, box-shadow 0.3s ease;
    }

    html.dark .login-card {
      background-color: #1e293b; /* Kotak Login Dark Mode */
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
    }

    .login-title {
      text-align: center;
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 2rem;
      color: #1e3a8a;
    }

    html.dark .login-title {
      color: #60a5fa;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 600;
      font-size: 0.9rem;
    }

    .form-group input {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 1rem;
      background-color: #f8fafc;
      color: #0f172a;
      box-sizing: border-box;
      transition: border-color 0.2s, background-color 0.3s, color 0.3s;
    }

    html.dark .form-group input {
      background-color: #0f172a;
      border-color: #334155;
      color: #f8fafc;
    }

    .form-group input:focus {
      outline: none;
      border-color: #2563eb;
    }

    .btn-login {
      width: 100%;
      padding: 0.75rem;
      background-color: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 1rem;
      transition: background-color 0.2s;
    }

    .btn-login:hover {
      background-color: #1d4ed8;
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.9rem;
      color: #64748b;
      text-decoration: none;
      transition: color 0.2s;
    }

    html.dark .back-link {
      color: #94a3b8;
    }

    .back-link:hover {
      color: #2563eb;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <h2 class="login-title">Login Admin</h2>
    
    <!-- Form Login Anda -->
    <form id="login-form">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="Masukkan username" required autocomplete="username">
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="••••••••••••" required autocomplete="current-password">
      </div>

      <button type="submit" class="btn-login">Masuk Dashboard</button>
    </form>

    <a href="/" class="back-link">&larr; Kembali ke Beranda</a>
  </div>

  <!-- Tombol Toggle Tema Melayang di Pojok Kanan Bawah -->
  <button id="theme-toggle" class="floating-theme-btn" style="position: fixed; bottom: 20px; right: 20px; z-index: 9999; padding: 12px 16px; border-radius: 50px; background-color: #1e293b; color: #f8fafc; border: none; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.2); transition: transform 0.2s;">
    🌙 / ☀️
  </button>

  <script>
    // Inisialisasi Tema Otomatis
    document.addEventListener("DOMContentLoaded", () => {
      const savedTheme = localStorage.getItem('theme') || 'light';
      if (savedTheme === 'dark') {
        document.documentElement.classList.add('dark');
      }

      const toggleBtn = document.getElementById('theme-toggle');
      if (toggleBtn) {
        toggleBtn.addEventListener('click', () => {
          document.documentElement.classList.toggle('dark');
          const activeTheme = document.documentElement.classList.contains('dark') ? 'dark' : 'light';
          localStorage.setItem('theme', activeTheme);
        });
      }
    });
  </script>
</body>
</html>
