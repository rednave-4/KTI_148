<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Admin - SMARIDASA</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: var(--bg, #f1f5f9);
      color: var(--text, #1e293b);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    html.dark body {
      background-color: var(--bg, #2e2e2e);
      color: var(--text, rgb(220, 220, 220));
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      padding: 2.5rem;
      border-radius: 12px;
      background-color: var(--card, #ffffff);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      transition: background-color 0.25s ease, box-shadow 0.25s ease;
    }

    html.dark .login-card {
      background-color: var(--card, #383838);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
    }

    .login-title {
      text-align: center;
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 2rem;
      color: var(--primary, #1e3a8a);
    }

    html.dark .login-title {
      color: var(--link, #4d9fef);
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 600;
      font-size: 0.9rem;
    }

    .form-group input {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1px solid var(--border, #cbd5e1);
      border-radius: 8px;
      font-size: 1rem;
      background-color: var(--bg, #f8fafc);
      color: var(--text, #0f172a);
      box-sizing: border-box;
      transition: border-color 0.2s, background-color 0.25s, color 0.25s;
    }

    html.dark .form-group input {
      background-color: var(--bg, #2e2e2e);
      border-color: var(--border, #383838);
      color: var(--text, rgb(220, 220, 220));
    }

    .form-group input:focus {
      outline: none;
      border-color: var(--primary, #2563eb);
    }

    /* Show / Hide Password */
    .password-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .password-wrap input {
      width: 100%;
      padding-right: 2.75rem;
    }

    .password-toggle {
      position: absolute;
      right: 0.6rem;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: transparent;
      cursor: pointer;
      font-size: 1.1rem;
      line-height: 1;
      padding: 0.25rem;
      color: var(--text-light, #64748b);
    }

    .password-toggle:hover {
      opacity: 0.85;
    }

    .btn-login {
      width: 100%;
      padding: 0.75rem;
      background-color: var(--accent, #ff3333);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 1rem;
      transition: background-color 0.2s;
    }

    .btn-login:hover {
      background-color: var(--accent-hover, #e02b2b);
    }

    .btn-login:disabled {
      background-color: #94a3b8;
      cursor: not-allowed;
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.9rem;
      color: var(--text-light, #64748b);
      text-decoration: none;
    }

    html.dark .back-link {
      color: var(--text-light, rgb(180, 180, 180));
    }

    .back-link:hover {
      color: var(--link, #4d9fef);
    }

    .error-message {
      background-color: #fee2e2;
      color: #991b1b;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      margin-bottom: 1.25rem;
      font-size: 0.9rem;
      display: none;
    }

    html.dark .error-message {
      background-color: #7f1d1d;
      color: #fecaca;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <h2 class="login-title">Login Admin</h2>

    <div id="error-message" class="error-message"></div>

    <form id="login-form">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="Masukkan username" required autocomplete="username">
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="password-wrap">
          <input
            type="password"
            id="password"
            name="password"
            placeholder="••••••••••••"
            required
            autocomplete="current-password"
          >
          <button type="button" id="toggle-password" class="password-toggle" aria-label="Tampilkan password">
            <!-- mata terbuka (default: password tersembunyi) -->
            <span id="eye-icon">👁</span>
          </button>
        </div>
      </div>

      <button type="submit" class="btn-login" id="login-btn">Masuk Dashboard</button>
    </form>

    <a href="/" class="back-link">&larr; Kembali ke Beranda</a>
  </div>

  <!-- Tombol Toggle Tema -->
  <button id="theme-toggle" class="floating-theme-btn"
    style="position: fixed; bottom: 20px; right: 20px; z-index: 9999;
          width: 48px; height: 48px; border-radius: 50%;
          background-color: #1e293b; color: #f8fafc;
          border: none; cursor: pointer;
          box-shadow: 0 4px 6px rgba(0,0,0,0.2);
          font-size: 1.25rem; display: flex; align-items: center; justify-content: center;
          transition: transform 0.2s, background-color 0.2s;">
    🌙
  </button>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // ======================
      // Theme Toggle (1 ikon)
      // ======================
      const toggleBtn = document.getElementById('theme-toggle');

      function updateThemeIcon() {
        if (!toggleBtn) return;
        const isDark = document.documentElement.classList.contains('dark');
        toggleBtn.textContent = isDark ? '☀️' : '🌙';
      }

      // Terapkan tema yang tersimpan
      const savedTheme = localStorage.getItem('theme') || 'light';
      if (savedTheme === 'dark') {
        document.documentElement.classList.add('dark');
      }
      updateThemeIcon();

      if (toggleBtn) {
        toggleBtn.addEventListener('click', () => {
          document.documentElement.classList.toggle('dark');
          const activeTheme = document.documentElement.classList.contains('dark') ? 'dark' : 'light';
          localStorage.setItem('theme', activeTheme);
          updateThemeIcon();
        });
      }

      // ======================
      // Show / Hide Password
      // ======================
      const togglePasswordBtn = document.getElementById('toggle-password');
      const passwordInput = document.getElementById('password');
      const eyeIcon = document.getElementById('eye-icon');

      if (togglePasswordBtn && passwordInput) {
        togglePasswordBtn.addEventListener('click', () => {
          const isHidden = passwordInput.type === 'password';
          passwordInput.type = isHidden ? 'text' : 'password';
          if (eyeIcon) {
            eyeIcon.textContent = isHidden ? '🙈' : '👁';
          }
          togglePasswordBtn.setAttribute(
            'aria-label',
            isHidden ? 'Sembunyikan password' : 'Tampilkan password'
          );
        });
      }

      // ======================
      // Login Logic
      // ======================
      const form = document.getElementById('login-form');
      const errorBox = document.getElementById('error-message');
      const loginBtn = document.getElementById('login-btn');

      if (form) {
        form.addEventListener('submit', async (e) => {
          e.preventDefault();

          const username = document.getElementById('username').value.trim();
          const password = document.getElementById('password').value;

          errorBox.style.display = 'none';
          errorBox.textContent = '';
          loginBtn.disabled = true;
          loginBtn.textContent = 'Memproses...';

          try {
            const res = await fetch('/api/admin/auth/login', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json'
              },
              body: JSON.stringify({ username, password })
            });

            const result = await res.json();

            if (result.success) {
              window.location.href = '/admin/dashboard.html';
            } else {
              errorBox.textContent = result.message || 'Username atau password salah.';
              errorBox.style.display = 'block';
              loginBtn.disabled = false;
              loginBtn.textContent = 'Masuk Dashboard';
            }
          } catch (err) {
            console.error(err);
            errorBox.textContent = 'Gagal terhubung ke server. Coba lagi.';
            errorBox.style.display = 'block';
            loginBtn.disabled = false;
            loginBtn.textContent = 'Masuk Dashboard';
          }
        });
      }
    });
  </script>
</body>
</html>
